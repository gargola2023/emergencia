name: Actualizar listado de emergencias

on:
  schedule:
    - cron: "*/15 * * * *"     # cada 15 min (GitHub puede retrasarlo algunos minutos)
  workflow_dispatch:            # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar API DMC y emergencias MOP
        env:
          DMC_USUARIO: ${{ secrets.DMC_USUARIO }}
          DMC_TOKEN: ${{ secrets.DMC_TOKEN }}
        run: |
          mkdir -p sitio
          cp index.html sitio/
          python scripts/actualizar_datos.py --salida sitio/datos

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deployment
        uses: actions/deploy-pages@v4
